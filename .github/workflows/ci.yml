name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: check · test · package (Dagger)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pin the Dagger CLI to the engineVersion in dagger.json. The engine runs
      # in Docker (preinstalled on ubuntu-latest); the module's TS SDK client is
      # generated on first `dagger call`.
      - name: Install Dagger CLI
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh \
            | DAGGER_VERSION=0.21.7 BIN_DIR=/usr/local/bin sudo -E sh
          dagger version

      # Single gate: type-check + vitest (unit + msw contract) + svelte-package
      # + publint, each in its own container, run concurrently. Fails if any
      # gate fails. Identical to running `dagger call ci --source=.` locally.
      - name: Run CI pipeline
        run: dagger call ci --source=.
        env:
          DO_NOT_TRACK: "1"
